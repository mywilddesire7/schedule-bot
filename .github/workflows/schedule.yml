name: schedule-bot

on:
  schedule:
    - cron: "*/30 5-21 * * *"   # каждые 30 минут, время UTC
  workflow_dispatch:             # ручной запуск кнопкой
    inputs:
      force:
        description: "Отправить расписание в беседу прямо сейчас"
        type: boolean
        default: false

permissions:
  contents: write                # чтобы сохранять state.json

concurrency:
  group: schedule-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python bot.py ${{ inputs.force && '--force' || '' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}

      - name: Save state
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
